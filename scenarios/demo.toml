# Demo mode: a scripted tour of the features, about 10 minutes, looping.
#
#   .venv/Scripts/python -m pixelwalk --profile dev --demo            (PC, http://localhost:8888)
#   sudo env PYTHONPATH=src ~/led-venv/bin/python -m pixelwalk --profile pi-check --demo   (Pi)
#
# Times are real seconds from the start of the demo. Each step starts from the [sim] values below
# and overrides only what it lists. Edit freely; the step labels are printed to the log.

[sim]
start = "2026-07-01 12:34:40"
speed = 1.0
lux = 250
indoor_c = 21.5
humidity = 45
pressure_hpa = 1012
motion = true
weather = "CLEAR"
outdoor_c = 18
wind_kmh = 5
gust_kmh = 10

[demo]
length = 584
loop = true

# --- the clock and the time of day ---------------------------------------------------------

[[sim.timeline]]
at = 0
label = "Noon: the robot jumps and bumps the minute block as the minute changes"
time = "2026-07-01 12:34:40"

[[sim.timeline]]
at = 25
label = "Dawn"
time = "2026-07-01 07:20:00"

[[sim.timeline]]
at = 37
label = "Dusk in the city: the windows and street lamps light up"
time = "2026-07-01 18:25:00"

[[sim.timeline]]
at = 49
label = "Night: lit windows, a thin waning moon and twinkling stars"
time = "2026-07-12 23:10:00"

[[sim.timeline]]
at = 61
label = "Evening time-lapse (600x): sunset, stars come out, the moon crosses the sky"
time = "2026-07-01 17:00:00"
speed = 600

[[sim.timeline]]
at = 111
label = "Morning time-lapse (600x): stars fade, the sun rises"
time = "2026-07-02 04:30:00"
speed = 600

