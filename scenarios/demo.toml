# --- more clock, then the light sensor -----------------------------------------------------

[[sim.timeline]]
at = 341
label = "Hour change: both blocks get bumped, hour first"
time = "2026-07-02 12:59:48"

[[sim.timeline]]
at = 356
label = "Dim evening (8 lux): the panel dims, and the robot walks into a cave"
time = "2026-07-02 21:30:00"
lux = 8

[[sim.timeline]]
at = 366
label = "Lights out: the panel goes completely dark"
