[project]
name = "pixelwalk"
version = "0.1.0"
description = "Side-scrolling platformer clock for a 64x64 RGB LED panel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roberto Migli" }]
keywords = ["led-matrix", "raspberry-pi", "hub75", "pixel-art", "clock"]
requires-python = ">=3.12"
dependencies = [
    "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = ["RGBMatrixEmulator", "pytest", "ruff"]  # emulator is PC-only; the Pi never needs it

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
