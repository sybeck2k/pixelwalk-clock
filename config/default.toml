[display]
backend = "emulator"      # emulator | matrix | png
rows = 64
cols = 64
hardware_mapping = "regular"
gpio_slowdown = 2
rotation = 270            # 0, 90, 180, 270 (matrix only)
target_fps = 30
max_brightness_pct = 100   # the panel's ceiling: the app works in 0..100 relative to this value
show_refresh_rate = false  # the library prints this to stdout; leave off in the service
# Only a 64x64 panel is supported (rows and cols are here for the library, not for resizing).
# Any other rgbmatrix option goes in [display.matrix] (see the README), for example:
#   [display.matrix]
#   pwm_bits = 9
#   led_rgb_sequence = "RBG"

[sensors]
backend = "sim"           # sim | sysfs | none | "pkg.module:factory" (your own)
poll_interval_s = 1.0
# For the sysfs backend, name the files your drivers publish (all optional; an unset or unreadable
# one just means "no reading"). Example layout: config/examples/pi-sensors.toml
# illuminance_path = "/sys/bus/iio/devices/iio:device0/in_illuminance_input"   # lux
# temperature_path = ...   # indoor, degC          humidity_path = ...   # %RH
# pressure_path = ...      # hPa (feeds the barometer clouding)
# lux_legacy_path = ...    # only if your driver's `lux` file is kilolux; used when illuminance_path is missing

[motion]
backend = "sim"           # sim | gpio | none | "pkg.module:factory"
chip = "gpiochip0"
line = 16
poll_hz = 5               # the PIR level is read this often (levels, not edges)

[weather]
backend = "sim"           # sim | openmeteo | none | "pkg.module:factory"
# For the openmeteo backend, put latitude and longitude in config/local.toml (not committed):
# the coordinates leave the house, so they are rounded to two decimals in the request.
poll_interval_s = 900
timeout_s = 10
max_age_s = 10800         # a result older than this counts as unknown
cache_path = "state/weather.json"   # last good response, so a restart without network has weather

[director]
min_stay_s = 600          # a biome stays at least this long (dev profile uses a short value)

[clock]
backend = "sim"           # sim | system
hour24 = true
sunrise_fallback = "07:30"   # used until the weather source knows real sunrise/sunset
sunset_fallback = "18:30"

[sim]
scenario = "scenarios/default.toml"

[brightness]
# Light sensor units are relative (sysfs value * 1000). Logarithmic curve between the two.
lux_low = 2.0
lux_high = 400.0
min_pct = 8
max_pct = 100
fallback_pct = 60       # used when the sensor has no reading; never turns the panel off
smoothing_s = 3.0
step_pct = 2            # ignore changes smaller than this, so the panel never visibly pumps
# Fully off in the dark. DISABLED while off_below_lux = 0. The sensor also sees the panel's own
# light, so tune both thresholds from real readings (panel on and off); on_above must be higher.
off_below_lux = 0.0
on_above_lux = 0.0
off_delay_s = 10.0      # light must stay below off_below_lux this long before the panel goes dark
on_delay_s = 3.0
wake_on_motion = false  # true: movement lights the display while it is dark

[presence]
idle_after_s = 300        # no motion this long: the robot sits by a campfire and sleeps, panel dims
dark_after_s = 900        # no motion this long: panel off
drowsy_factor = 0.5       # brightness multiplier while drowsy
wake_s = 2.0              # the stretch when motion returns
wake_ramp_s = 1.0         # brightness ramps back up over this long
quiet_enabled = false     # quiet hours: dark when the room is empty, capped brightness otherwise
quiet_start = "23:30"
quiet_end = "06:30"
quiet_cap_pct = 20
quiet_empty_after_s = 30

[moments]
# Rare, bigger things on top of the walking hero: a deer or a tram crossing, a UFO, the robot finding a
# chest or meeting a friend, an aurora or fireworks. A day gets a plan of a few times (random, but the
# same after a restart) between 08:00 and 22:00; each one waits for a scene it fits.
enabled = true
per_day = 2.5               # on average: two or three a day. 0 turns them off

[events]
# Rare extras (a bird, a shooting star, a coin to pick up, sparkles at the hour) and dated looks.
enabled = true
rate = 1.0                # random events: 1 is a few per hour, 0 turns them off (dated looks stay)
birthdays = []            # ["03-14"]: a cake rolls past all day. Put real dates only in config/local.toml.

[[events.dated]]          # style: lights | pumpkins | cake. Ranges are inclusive and may wrap the new year.
name = "christmas"
from = "12-01"
to = "12-26"
style = "lights"

[[events.dated]]
name = "halloween"
from = "10-25"
to = "10-31"
style = "pumpkins"

[hud]
indoor = true             # indoor temperature, top-left
outdoor = true            # outdoor temperature, top-right
date = true               # month and day, top-centre (e.g. NOV 16)

[hero]
character = "robot"       # who walks through the world: any complete character in assets/src (e.g. char_robot.txt)
cold_c = 18               # indoor temperatures below / above these are shown in cyan / orange
hot_c = 26

[world]
biome = "auto"            # "auto" follows the weather, or pin one: grass, snow, desert

[control]
# Optional web page and API to change settings on the running app. OFF by default.
# Anyone who can reach the port can change the display: keep host on 127.0.0.1, or set a token.
enabled = false
host = "127.0.0.1"        # "0.0.0.0" to reach it from another machine
port = 8080
token = ""                # if set, requests must send it (?token=... or X-Token header)
settings_path = "state/settings.json"   # changes made while running are kept here across restarts
