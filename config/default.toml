[display]
backend = "emulator"      # emulator | matrix | png
rows = 64
cols = 64
hardware_mapping = "regular"
gpio_slowdown = 2
rotation = 270            # 0, 90, 180, 270 (Pi only)
target_fps = 30
show_refresh_rate = false  # the library prints this to stdout; leave off in the service

[sensors]
backend = "sim"           # sim | sysfs
poll_interval_s = 1.0

[motion]
backend = "sim"           # sim | gpio
chip = "gpiochip0"
line = 16

[weather]
backend = "sim"           # sim | openmeteo

[clock]
backend = "sim"           # sim | system
hour24 = true
sunrise_fallback = "07:30"   # used until the weather source knows real sunrise/sunset
sunset_fallback = "18:30"

[sim]
scenario = "scenarios/default.toml"

[brightness]
# Light sensor units are relative (sysfs value * 1000). Logarithmic curve between the two.
lux_low = 2.0
lux_high = 400.0
min_pct = 8
max_pct = 100
fallback_pct = 60       # used when the sensor has no reading; never turns the panel off
smoothing_s = 3.0
step_pct = 2            # ignore changes smaller than this, so the panel never visibly pumps
# Fully off in the dark. DISABLED while off_below_lux = 0. The sensor also sees the panel's own
# light, so tune both thresholds from real readings (panel on and off); on_above must be higher.
off_below_lux = 0.0
on_above_lux = 0.0
off_delay_s = 10.0      # light must stay below off_below_lux this long before the panel goes dark
on_delay_s = 3.0
wake_on_motion = false  # true: movement lights the display while it is dark
